name: Build dsh zip

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-dsh-zip
  cancel-in-progress: false

jobs:
  plan:
    name: Plan one release per dist-tag
    runs-on: windows-latest
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Resolve the newest version of every dist-tag
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $distTags  = npm view '@deepseek-ai/dsh' dist-tags --json | ConvertFrom-Json
          $published = gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName --jq '.[].tagName'
          $force     = $env:FORCE -eq 'true'

          $items = foreach ($group in $distTags.PSObject.Properties | Group-Object Value) {
            $tag    = "v$($group.Name)"
            $exists = $published -contains $tag
            if ($exists -and -not $force) {
              Write-Host "::notice::$tag already published - skip"
              continue
            }
            [pscustomobject]@{ version = $group.Name; exists = $exists }
          }

          if ($items) {
            $releases = '[' + (($items | ForEach-Object { $_ | ConvertTo-Json -Compress }) -join ',') + ']'
          } else {
            $releases = '[]'
          }

          "releases=$releases" >> $env:GITHUB_OUTPUT
          Write-Host "matrix: $releases"
          $items | ForEach-Object { "- v$($_.version): queued" } |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  release:
    name: dsh ${{ matrix.version || 'nothing to do' }}
    needs: plan
    if: needs.plan.outputs.releases != '[]'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.releases) }}
    steps:
      - name: Nothing to build
        run: Write-Host "::notice::Every dist-tag already has a release."

      - uses: actions/checkout@v7

      - name: Install dsh, pnpm and node.exe into runtime
        env:
          VERSION: ${{ matrix.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm install --prefix runtime --omit=dev "@deepseek-ai/dsh@$env:VERSION" pnpm
          Copy-Item (Get-Command node).Source runtime/node.exe -Force

      - name: Create the zip archive
        id: pack
        env:
          VERSION: ${{ matrix.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $zip = "dsh-v$env:VERSION-windows-x64.zip"
          & "$env:ProgramFiles\7-Zip\7z.exe" a -bb0 $zip runtime dsh.bat
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Publish the release
        env:
          VERSION: ${{ matrix.version }}
          EXISTS: ${{ matrix.exists }}
          ZIP: ${{ steps.pack.outputs.zip }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = "v$env:VERSION"

          if ($env:EXISTS -eq 'true') {
            gh release upload $tag $env:ZIP --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $env:ZIP --latest=false --repo $env:GITHUB_REPOSITORY
          }

          Write-Host "::notice::Published $tag with $env:ZIP"
