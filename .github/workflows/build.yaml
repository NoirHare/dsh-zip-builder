name: dsh-zip-builder

on:
  workflow_dispatch:
    inputs:
      force:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            suffix: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - id: dsh-latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $Version = (npm view @deepseek-ai/dsh version).Trim()
          "version=$Version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          gh release view "v$Version" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - if: ${{ steps.dsh-latest.outputs.exists != 'true' || inputs.force }}
        uses: actions/checkout@v7

      - if: ${{ steps.dsh-latest.outputs.exists != 'true' || inputs.force }}
        run: |
          New-Item -Path ".\runtime" -ItemType Directory -Force | Out-Null
          Set-Location ".\runtime"
          npm i @deepseek-ai/dsh@latest pnpm@latest --no-audit --no-fund
          Copy-Item ((node -p "process.execPath").Trim()) ".\node.exe" -Force
          Remove-Item -Force .\package.json, .\package-lock.json -ErrorAction SilentlyContinue
      - if: ${{ steps.dsh-latest.outputs.exists != 'true' || inputs.force }}
        shell: pwsh
        run: Compress-Archive -Force -Path .\runtime, .\dsh.bat -DestinationPath .\dsh-${{ matrix.suffix }}.zip

      - if: ${{ steps.dsh-latest.outputs.exists == 'true' && inputs.force }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete "v${{ steps.dsh-latest.outputs.version }}" --repo "${{ github.repository }}" --yes --cleanup-tag
      - if: ${{ steps.dsh-latest.outputs.exists != 'true' || inputs.force }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.dsh-latest.outputs.version }}" .\dsh-${{ matrix.suffix }}.zip --repo "${{ github.repository }}" --title "v${{ steps.dsh-latest.outputs.version }}"