name: Build dsh zip

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      force:
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-dsh-zip
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Resolve latest version of @deepseek-ai/dsh
        id: version
        run: |
          "version=$(npm view '@deepseek-ai/dsh' version)" >> $env:GITHUB_OUTPUT

      - name: Check whether the release already exists
        id: check
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $out = gh release view "v$env:VERSION" --repo $env:GITHUB_REPOSITORY 2>&1

          if ($LASTEXITCODE -eq 0) {
            $exists = 'true'
          } elseif ($out -match 'not found') {
            $exists = 'false'
          } else {
            throw "gh release view failed: $out"
          }

          Write-Host "::notice::v$env:VERSION exists=$exists"
          "exists=$exists" >> $env:GITHUB_OUTPUT
          exit 0

      - uses: actions/checkout@v7
        if: steps.check.outputs.exists == 'false' || inputs.force

      - name: Install dsh, pnpm and node.exe into runtime
        if: steps.check.outputs.exists == 'false' || inputs.force
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm install --prefix runtime --omit=dev "@deepseek-ai/dsh@$env:VERSION" pnpm

          Copy-Item (Get-Command node).Source runtime/node.exe -Force

      - name: Create the zip archive
        id: pack
        if: steps.check.outputs.exists == 'false' || inputs.force
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zip = "dsh-$env:VERSION-win-x64.zip"
          & "$env:ProgramFiles\7-Zip\7z.exe" a -bb0 $zip runtime dsh.bat
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Publish the release
        if: steps.check.outputs.exists == 'false' || inputs.force
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EXISTS: ${{ steps.check.outputs.exists }}
          ZIP: ${{ steps.pack.outputs.zip }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"

          if ($env:EXISTS -eq 'true') {
            gh release upload $tag $env:ZIP --clobber
          } else {
            gh release create $tag $env:ZIP --notes ""
          }

          Write-Host "::notice::Published $tag with $env:ZIP"
